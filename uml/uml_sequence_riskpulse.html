<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0f1923; font-family: Arial, sans-serif; }
  .title { fill: #fff; font-size: 15px; font-weight: bold; }
  .subtitle { fill: #7ec8e3; font-size: 11px; }
  .msg { fill: #e0e0e0; font-size: 9.5px; }
  .ret { fill: #aaa; font-size: 9px; font-style: italic; }
  .note { fill: #fff3cd; font-size: 9.5px; }
  .loop-label { fill: #7ec8e3; font-size: 10px; font-weight: bold; }
  .frag-label { fill: #ff9800; font-size: 10px; font-weight: bold; }
  .actor-box { fill: #1F4E79; }
  .actor-text { fill: #fff; font-size: 10px; font-weight: bold; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 940" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="msg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7ec8e3"/>
    </marker>
    <marker id="ret" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4caf50"/>
    </marker>
    <marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef5350"/>
    </marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff9800"/>
    </marker>
  </defs>

  <rect width="1000" height="940" fill="#0f1923"/>

  <!-- Title -->
  <text x="500" y="25" text-anchor="middle" class="title">Diagramme de Séquence — RiskPulse</text>
  <text x="500" y="43" text-anchor="middle" class="subtitle">Flux Principal : Analyse Complète d'un Texte + Propagation + Rapport</text>

  <!-- ═══ ACTORS (lifeline headers) ═══ -->
  <!-- positions: 80, 210, 340, 470, 600, 730, 860 -->
  <!-- Analyste / AnalysisView / RiskController / NLPEngine / GraphEngine+GNN / PropagEngine / Repository+PDF -->

  <!-- Analyste -->
  <ellipse cx="80" cy="80" rx="14" ry="14" fill="none" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="80" y1="94" x2="80" y2="120" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="58" y1="107" x2="102" y2="107" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="80" y1="120" x2="60" y2="140" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="80" y1="120" x2="100" y2="140" stroke="#7ec8e3" stroke-width="2"/>
  <text x="80" y="158" text-anchor="middle" class="actor-text" fill="#7ec8e3">Analyste</text>

  <!-- AnalysisView -->
  <rect x="165" y="60" width="90" height="30" rx="3" class="actor-box"/>
  <text x="210" y="80" text-anchor="middle" class="actor-text">AnalysisView</text>

  <!-- RiskController -->
  <rect x="295" y="60" width="90" height="30" rx="3" fill="#1b5e20"/>
  <text x="340" y="80" text-anchor="middle" class="actor-text">RiskController</text>

  <!-- NLPEngine -->
  <rect x="425" y="60" width="90" height="30" rx="3" fill="#5D4037"/>
  <text x="470" y="80" text-anchor="middle" class="actor-text">NLPEngine</text>

  <!-- GNNModel -->
  <rect x="555" y="60" width="90" height="30" rx="3" fill="#7f1d1d"/>
  <text x="600" y="80" text-anchor="middle" class="actor-text">GNN + IsoForest</text>

  <!-- PropagEngine -->
  <rect x="685" y="60" width="90" height="30" rx="3" fill="#7f1d1d"/>
  <text x="730" y="80" text-anchor="middle" class="actor-text">PropagEngine</text>

  <!-- Repository -->
  <rect x="815" y="60" width="90" height="30" rx="3" fill="#4a148c"/>
  <text x="860" y="80" text-anchor="middle" class="actor-text">Repository</text>

  <!-- ═══ LIFELINES ═══ -->
  <line x1="80"  y1="165" x2="80"  y2="920" stroke="#7ec8e3" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="210" y1="165" x2="210" y2="920" stroke="#2E86C1" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="340" y1="165" x2="340" y2="920" stroke="#4caf50" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="470" y1="165" x2="470" y2="920" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="600" y1="165" x2="600" y2="920" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="730" y1="165" x2="730" y2="920" stroke="#ef5350" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="860" y1="165" x2="860" y2="920" stroke="#9c27b0" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- ═══ ACTIVATION BOXES ═══ -->
  <rect x="74" y="185" width="12" height="650" rx="1" fill="#7ec8e3" opacity="0.3"/>
  <rect x="204" y="205" width="12" height="600" rx="1" fill="#2E86C1" opacity="0.4"/>
  <rect x="334" y="225" width="12" height="560" rx="1" fill="#4caf50" opacity="0.4"/>
  <rect x="464" y="250" width="12" height="150" rx="1" fill="#ffc107" opacity="0.4"/>
  <rect x="594" y="430" width="12" height="100" rx="1" fill="#ef5350" opacity="0.4"/>
  <rect x="724" y="565" width="12" height="120" rx="1" fill="#ef5350" opacity="0.4"/>
  <rect x="854" y="730" width="12" height="80" rx="1" fill="#9c27b0" opacity="0.4"/>

  <!-- ════════════════════════════════ MESSAGES ════════════════════════════════ -->

  <!-- 1. Auth -->
  <rect x="30" y="168" width="340" height="18" rx="2" fill="#0d1f2d" opacity="0.8"/>
  <text x="35" y="181" class="frag-label">[ Authentification ]</text>

  <line x1="80" y1="195" x2="203" y2="195" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="130" y="191" class="msg">login(user, pwd)</text>
  <line x1="210" y1="205" x2="333" y2="205" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="250" y="201" class="msg">authenticate()</text>
  <line x1="340" y1="215" x2="207" y2="215" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="260" y="212" class="ret">: token</text>
  <line x1="210" y1="225" x2="77" y2="225" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="120" y="222" class="ret">: session ok</text>

  <!-- 2. Import -->
  <rect x="30" y="238" width="440" height="18" rx="2" fill="#0d2a1a" opacity="0.8"/>
  <text x="35" y="251" class="frag-label">[ Import Texte — Rupture 1 ]</text>

  <line x1="80" y1="260" x2="203" y2="260" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="100" y="256" class="msg">import_text(content)</text>
  <line x1="210" y1="270" x2="333" y2="270" stroke="#4caf50" stroke-width="1.5" marker-end="url(#green)"/>
  <text x="240" y="266" class="msg">analyze(text)</text>
  <line x1="340" y1="280" x2="463" y2="280" stroke="#ffc107" stroke-width="1.5" marker-end="url(#orange)"/>
  <text x="375" y="276" class="msg">extract_entities(text)</text>

  <!-- NLP processing -->
  <rect x="450" y="288" width="130" height="14" rx="2" fill="#5D4037" opacity="0.6"/>
  <text x="515" y="299" text-anchor="middle" class="note" fill="#fff3cd">spaCy NER + coref</text>

  <line x1="470" y1="312" x2="337" y2="312" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="380" y="309" class="ret">: List[Entity]</text>

  <line x1="340" y1="322" x2="463" y2="322" stroke="#ffc107" stroke-width="1.5" marker-end="url(#orange)"/>
  <text x="370" y="318" class="msg">extract_relations(text)</text>

  <rect x="450" y="330" width="130" height="14" rx="2" fill="#5D4037" opacity="0.6"/>
  <text x="515" y="341" text-anchor="middle" class="note" fill="#fff3cd">co-occurrence + weight</text>

  <line x1="470" y1="354" x2="337" y2="354" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="380" y="351" class="ret">: List[Relation]</text>

  <line x1="340" y1="364" x2="463" y2="364" stroke="#ffc107" stroke-width="1.5" marker-end="url(#orange)"/>
  <text x="365" y="360" class="msg">build_graph(): RiskGraph</text>
  <line x1="470" y1="390" x2="337" y2="390" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="380" y="387" class="ret">: RiskGraph G</text>

  <line x1="340" y1="400" x2="207" y2="400" stroke="#2E86C1" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="235" y="397" class="msg">display_graph(G)</text>

  <rect x="170" y="406" width="130" height="14" rx="2" fill="#1F4E79" opacity="0.7"/>
  <text x="235" y="417" text-anchor="middle" class="note">Graphe affiché en live</text>

  <!-- 3. IA Comparison -->
  <rect x="30" y="428" width="640" height="18" rx="2" fill="#1a0a0a" opacity="0.8"/>
  <text x="35" y="441" class="frag-label">[ Comparaison Modèles — Rupture 4 ]</text>

  <line x1="340" y1="450" x2="593" y2="450" stroke="#ef5350" stroke-width="1.5" marker-end="url(#red)"/>
  <text x="420" y="446" class="msg">train(G) + predict_all()</text>

  <rect x="560" y="458" width="130" height="24" rx="2" fill="#7f1d1d" opacity="0.6"/>
  <text x="625" y="467" text-anchor="middle" class="note" fill="#ffcdd2">IsolationForest</text>
  <text x="625" y="479" text-anchor="middle" class="note" fill="#ffcdd2">GNN GraphSAGE</text>

  <line x1="600" y1="490" x2="337" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="410" y="487" class="ret">: {scores_A, scores_B, metrics}</text>

  <!-- Centrality -->
  <line x1="340" y1="505" x2="593" y2="505" stroke="#ef5350" stroke-width="1.5" marker-end="url(#red)"/>
  <text x="400" y="501" class="msg">detect_hidden_critical(G)</text>
  <line x1="600" y1="530" x2="337" y2="530" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="400" y="527" class="ret">: List[critical_nodes] ★</text>

  <line x1="340" y1="542" x2="207" y2="542" stroke="#2E86C1" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="235" y="538" class="msg">show_comparison()</text>

  <!-- 4. Propagation -->
  <rect x="30" y="558" width="760" height="18" rx="2" fill="#1a0a0a" opacity="0.8"/>
  <text x="35" y="571" class="frag-label">[ Simulation Propagation — Rupture 2 ]</text>

  <line x1="80" y1="582" x2="203" y2="582" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="95" y="578" class="msg">inject_risk(node, 85)</text>
  <line x1="210" y1="592" x2="333" y2="592" stroke="#4caf50" stroke-width="1.5" marker-end="url(#green)"/>
  <text x="245" y="588" class="msg">propagate(node, 85)</text>
  <line x1="340" y1="602" x2="723" y2="602" stroke="#ef5350" stroke-width="1.5" marker-end="url(#red)"/>
  <text x="490" y="598" class="msg">propagate(source, intensity)</text>

  <!-- SIR loop -->
  <rect x="700" y="612" width="160" height="60" rx="3" fill="#1a0a08" stroke="#ef5350" stroke-width="1" opacity="0.8"/>
  <text x="712" y="625" class="loop-label">loop [SIR steps]</text>
  <text x="712" y="640" class="msg" fill="#ffcdd2">step() → propagate</text>
  <text x="712" y="653" class="msg" fill="#ffcdd2">until converged</text>
  <text x="712" y="666" class="msg" fill="#ffcdd2">OR max iterations</text>

  <line x1="730" y1="680" x2="337" y2="680" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="450" y="677" class="ret">: heatmap {node: risk_level}</text>

  <line x1="340" y1="692" x2="207" y2="692" stroke="#2E86C1" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="220" y="689" class="msg">animate_propagation(hm)</text>

  <rect x="170" y="698" width="130" height="14" rx="2" fill="#1F4E79" opacity="0.7"/>
  <text x="235" y="709" text-anchor="middle" class="note">Vague rouge animée ★</text>

  <!-- 5. Translation + Save -->
  <rect x="30" y="720" width="870" height="18" rx="2" fill="#150a20" opacity="0.8"/>
  <text x="35" y="733" class="frag-label">[ Traduction + Sauvegarde ]</text>

  <line x1="80" y1="743" x2="203" y2="743" stroke="#7ec8e3" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="105" y="739" class="msg">translate_report("AR")</text>
  <line x1="210" y1="753" x2="333" y2="753" stroke="#4caf50" stroke-width="1.5" marker-end="url(#green)"/>
  <text x="235" y="749" class="msg">translate(report, "AR")</text>
  <line x1="340" y1="763" x2="207" y2="763" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="260" y="760" class="ret">: translated_report</text>

  <line x1="340" y1="780" x2="853" y2="780" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="550" y="776" class="msg">save(analysis + graph + report)</text>
  <line x1="860" y1="800" x2="337" y2="800" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="550" y="797" class="ret">: analysis_id</text>

  <line x1="340" y1="812" x2="853" y2="812" stroke="#9c27b0" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="540" y="808" class="msg">export_pdf(analysis_id)</text>
  <line x1="860" y1="828" x2="337" y2="828" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="540" y="825" class="ret">: PDF file path</text>

  <line x1="340" y1="840" x2="207" y2="840" stroke="#2E86C1" stroke-width="1.5" marker-end="url(#msg)"/>
  <text x="235" y="837" class="msg">show_success(path)</text>
  <line x1="210" y1="852" x2="77" y2="852" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#ret)"/>
  <text x="110" y="849" class="ret">: "Analyse complète ✓"</text>

  <!-- Final note -->
  <rect x="30" y="870" width="940" height="50" rx="4" fill="#0d1f2d" stroke="#2E86C1" stroke-width="1"/>
  <text x="500" y="888" text-anchor="middle" fill="#7ec8e3" font-size="10" font-weight="bold">RÉSUMÉ DU FLUX</text>
  <text x="500" y="906" text-anchor="middle" fill="#ccc" font-size="9">Texte brut → NLP (entités + relations) → Graphe construit → IA double modèle → Nœuds cachés révélés → Propagation animée → Traduction → PDF exporté</text>
</svg>
</body>
</html>
